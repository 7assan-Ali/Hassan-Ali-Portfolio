name: Polish Portfolio Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[skip wow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium visual polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          /* WOW layer */
          .brand{display:flex;align-items:center;gap:.55rem}.brand-logo{width:34px;height:34px;border-radius:10px;box-shadow:0 0 28px #39d0c544;transition:.3s}.brand:hover .brand-logo{transform:rotate(-6deg) scale(1.06)}
          .hero:after{content:"";position:absolute;inset:10% -5% auto 35%;height:520px;background:radial-gradient(circle,#39d0c51c,transparent 62%);filter:blur(10px);pointer-events:none;z-index:-1}.hero{position:relative}
          .hero h1{position:relative;text-shadow:0 0 55px #39d0c51c}.hero h1:after{content:"";position:absolute;width:120px;height:8px;left:0;bottom:-18px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 28px #39d0c566}.hero-visual:before,.hero-visual:after{content:"";position:absolute;border:1px solid #39d0c533;border-radius:50%;pointer-events:none}.hero-visual:before{width:430px;height:430px;animation:pulseRing 4s ease-in-out infinite}.hero-visual:after{width:500px;height:500px;border-style:dashed;animation:spin 28s linear infinite;opacity:.45}@keyframes pulseRing{50%{transform:scale(1.04);opacity:.55}}
          .quick{box-shadow:0 20px 70px #0004}.quick div{transition:.25s}.quick div:hover{background:linear-gradient(145deg,#132b43,#0c1b2c);transform:translateY(-3px)}
          .cert{position:relative;overflow:hidden}.cert:before{content:"VIEW CERTIFICATE";position:absolute;top:14px;right:14px;z-index:2;padding:.32rem .5rem;border-radius:999px;background:#07111fcc;border:1px solid #ffffff25;color:#fff;font-size:.55rem;font-weight:800;letter-spacing:.08em;opacity:0;transform:translateY(-6px);transition:.25s;pointer-events:none}.cert:hover:before{opacity:1;transform:none}.cert-image{width:100%;height:210px;object-fit:cover;border-radius:16px;border:1px solid var(--line);background:var(--surface2);display:block;margin-bottom:1rem;cursor:zoom-in;transition:transform .45s,filter .3s,box-shadow .3s}.cert:hover .cert-image{transform:scale(1.025);filter:brightness(1.08);box-shadow:0 18px 45px #0005}
          .cert-lightbox{position:fixed;inset:0;background:#020813ed;backdrop-filter:blur(18px);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}.cert-lightbox.open{display:flex}.cert-lightbox img{max-width:min(1100px,94vw);max-height:84vh;object-fit:contain;border-radius:18px;box-shadow:0 30px 100px #0009;border:1px solid #ffffff20}.cert-lightbox .close{position:absolute;right:24px;top:24px;width:46px;height:46px;border:1px solid #ffffff25;border-radius:14px;background:#07111fcc;color:#fff;font-size:1.2rem;cursor:pointer}.cert-lightbox .hint{position:absolute;bottom:20px;color:#ffffff99;font-size:.7rem}
          .spotlight{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(450px circle at var(--mx,50%) var(--my,50%),#39d0c508,transparent 55%)}
          @media(max-width:650px){.hero:after{inset:0;height:360px}.hero h1:after{left:50%;transform:translateX(-50%)}.hero-visual:before{width:300px;height:300px}.hero-visual:after{width:340px;height:340px}.cert-image{height:220px}}
          @media(prefers-reduced-motion:reduce){.hero-visual:after,.hero-visual:before{animation:none}.cert-image{transition:none}}
          '''
          if '/* WOW layer */' not in html:
              html = html.replace('</style>', css + '</style>', 1)

          html = html.replace('<a class="brand" href="#home">Hassan <span>Ali</span></a>', '<a class="brand" href="#home"><img class="brand-logo" src="assets/hassan-ali-logo.svg" alt="Hassan Ali logo"><span>Hassan <span>Ali</span></span></a>')

          if 'rel="icon" href="assets/hassan-ali-logo.svg"' not in html:
              html = html.replace('<title>Hassan Ali | Data Analyst | AI & Data Science</title>', '<title>Hassan Ali | Data Analyst | AI & Data Science</title><link rel="icon" type="image/svg+xml" href="assets/hassan-ali-logo.svg">')

          if 'id="certLightbox"' not in html:
              modal = '''<div class="cert-lightbox" id="certLightbox" role="dialog" aria-modal="true" aria-label="Certificate preview"><button class="close" id="certClose" aria-label="Close certificate preview"><i class="fa-solid fa-xmark"></i></button><img id="certPreview" src="" alt="Certificate preview"><div class="hint">Click outside or press ESC to close</div></div>'''
              html = html.replace('</body>', '<div class="spotlight" aria-hidden="true"></div>' + modal + '''<script>\nconst certBox=document.getElementById('certLightbox'),certPreview=document.getElementById('certPreview'),certClose=document.getElementById('certClose');\ndocument.querySelectorAll('.cert-image').forEach(img=>img.addEventListener('click',()=>{certPreview.src=img.src;certPreview.alt=img.alt||'Certificate preview';certBox.classList.add('open');document.body.style.overflow='hidden';}));\nfunction closeCert(){certBox.classList.remove('open');document.body.style.overflow='';certPreview.src='';}\ncertClose.addEventListener('click',closeCert);certBox.addEventListener('click',e=>{if(e.target===certBox)closeCert()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCert()});\nconst spot=document.querySelector('.spotlight');window.addEventListener('pointermove',e=>{spot.style.setProperty('--mx',e.clientX+'px');spot.style.setProperty('--my',e.clientY+'px')},{passive:true});\n</script></body>''', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit polished experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Create wow-level portfolio experience [skip wow]"
          git push
