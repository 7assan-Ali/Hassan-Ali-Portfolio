name: Reorganize Skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize-skills.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reorganize skills
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          css = r'''<style id="skills-category-style">
          .skills-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
          .skill-category{background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 45px #0003;transition:.3s}
          .skill-category:hover{transform:translateY(-4px);border-color:#39d0c555;box-shadow:0 18px 50px #0004}
          .skill-category-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
          .skill-category-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:#39d0c514;border:1px solid #39d0c52b;font-size:1rem}
          .skill-category h3{font:700 1.05rem 'Space Grotesk';margin:0}
          .skill-category p{color:var(--muted);font-size:.68rem;margin:0 0 15px 54px}
          .skill-category .skills-grid{grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
          .skill-category .skill{min-height:96px;padding:14px}
          .skill-category .skill i{width:36px;height:36px;font-size:.9rem}
          .skill-category .skill strong{font-size:.78rem}
          .skill-category .skill small{font-size:.6rem}
          @media(max-width:900px){.skills-categories{grid-template-columns:1fr}.skill-category .skills-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:560px){.skill-category .skills-grid{grid-template-columns:1fr}}
          </style>'''

          script = r'''<script id="skills-category-script">
          document.addEventListener('DOMContentLoaded',()=>{
            const section=document.querySelector('#skills');
            if(!section || section.dataset.reorganized==='true') return;
            const grids=[...section.querySelectorAll('.skills-grid')];
            const cards=[];
            grids.forEach(g=>cards.push(...g.querySelectorAll(':scope > .skill')));
            if(!cards.length) return;

            const groups=[
              {name:'Programming & Data',icon:'fa-code',desc:'Core programming languages and data analysis tools.',keys:['python','sql','c++','java','pandas','numpy','r ','r,']},
              {name:'Data Visualization & BI',icon:'fa-chart-column',desc:'Tools for dashboards, reporting, visualization, and business intelligence.',keys:['power bi','powerbi','tableau','excel','matplotlib','seaborn','plotly']},
              {name:'Machine Learning & AI',icon:'fa-brain',desc:'Machine learning, AI, and modern generative AI capabilities.',keys:['machine learning','scikit','sklearn','generative ai','genai','prompt','llm','artificial intelligence','deep learning','tensorflow','pytorch']},
              {name:'Development & Tools',icon:'fa-toolbox',desc:'Development frameworks, applications, and engineering tools.',keys:['git','github','fastapi','tkinter','dash','flutter','dart','kotlin','docker','api']},
              {name:'Professional Skills',icon:'fa-people-group',desc:'Professional strengths that support collaboration and data storytelling.',keys:['communication','teamwork','problem solving','time management','presentation','adaptability']}
            ];

            const root=document.createElement('div');
            root.className='skills-categories';
            const buckets=groups.map(g=>({g,cards:[]}));
            const other=[];
            cards.forEach(card=>{
              const text=card.textContent.toLowerCase().replace(/\s+/g,' ').trim();
              const match=buckets.find(b=>b.g.keys.some(k=>text.includes(k)));
              (match?match.cards:other).push(card);
            });
            if(other.length){buckets.push({g:{name:'Additional Skills',icon:'fa-layer-group',desc:'Additional technical skills already included in the portfolio.'},cards:other});}

            buckets.filter(b=>b.cards.length).forEach(({g,cards:items})=>{
              const box=document.createElement('div'); box.className='skill-category';
              box.innerHTML=`<div class="skill-category-head"><div class="skill-category-icon"><i class="fa-solid ${g.icon}"></i></div><h3>${g.name}</h3></div><p>${g.desc}</p>`;
              const grid=document.createElement('div'); grid.className='skills-grid';
              items.forEach(card=>grid.appendChild(card));
              box.appendChild(grid); root.appendChild(box);
            });

            grids.forEach(g=>g.closest('.skills-subsection')?.remove());
            const tabs=section.querySelector('.tabs');
            if(tabs) tabs.remove();
            const anchor=section.querySelector('.section-top');
            (anchor?.nextElementSibling ? anchor.parentNode : section).appendChild(root);
            section.dataset.reorganized='true';
          });
          </script>'''

          if 'id="skills-category-style"' not in html:
              html=html.replace('</head>',css+'\n</head>',1)
          if 'id="skills-category-script"' not in html:
              html=html.replace('</body>',script+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: organize skills into professional categories"
          git push
