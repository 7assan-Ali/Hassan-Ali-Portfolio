name: Reorganize Skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize-skills.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reorganize skills
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          css = r'''<style id="skills-category-style">
          .skills-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}
          .skill-category{background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 14px 50px #0003;transition:.3s}
          .skill-category:hover{transform:translateY(-4px);border-color:#39d0c555;box-shadow:0 20px 55px #0004}
          .skill-category-head{display:flex;align-items:center;gap:13px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
          .skill-category-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--accent);background:#39d0c514;border:1px solid #39d0c52b;font-size:1.05rem;flex:none}
          .skill-category h3{font:700 1.35rem 'Space Grotesk';margin:0;letter-spacing:-.03em}
          .skill-category p{color:var(--muted);font-size:.68rem;margin:2px 0 0}
          .skill-category .skills-grid{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0}
          .skill-category .skill{display:inline-flex;align-items:center;gap:9px;width:auto;min-width:0;min-height:0;padding:9px 13px;border-radius:999px;background:linear-gradient(145deg,var(--surface),var(--surface2));box-shadow:none;transition:transform .2s,border-color .2s,box-shadow .2s}
          .skill-category .skill:hover{transform:translateY(-3px);box-shadow:0 10px 25px #0003}
          .skill-category .skill:before{border-radius:999px}
          .skill-category .skill i{grid-row:auto;width:28px;height:28px;border-radius:50%;font-size:.72rem;flex:none}
          .skill-category .skill strong{font-size:.72rem;line-height:1;white-space:nowrap;margin:0}
          .skill-category .skill small{display:none}
          @media(max-width:900px){.skills-categories{grid-template-columns:1fr}}
          @media(max-width:560px){.skill-category .skills-grid{gap:8px}.skill-category .skill{padding:8px 11px}.skill-category .skill i{width:26px;height:26px;font-size:.68rem}}
          </style>'''

          script = r'''<script id="skills-category-script">
          document.addEventListener('DOMContentLoaded',()=>{
            const section=document.querySelector('#skills');
            if(!section) return;
            const grids=[...section.querySelectorAll('.skills-grid')];
            const cards=[];
            grids.forEach(g=>cards.push(...g.querySelectorAll(':scope > .skill')));
            if(!cards.length) return;

            const softKeys=['communication','teamwork','problem solving','time management','presentation','adaptability'];
            const technical=[];
            const soft=[];
            cards.forEach(card=>{
              const text=card.textContent.toLowerCase().replace(/\s+/g,' ').trim();
              if(softKeys.some(k=>text.includes(k))) soft.push(card); else technical.push(card);
            });

            const root=document.createElement('div');
            root.className='skills-categories';
            const makeBox=(name,icon,desc,items)=>{
              if(!items.length) return;
              const box=document.createElement('div');
              box.className='skill-category';
              box.innerHTML=`<div class="skill-category-head"><div class="skill-category-icon"><i class="fa-solid ${icon}"></i></div><div><h3>${name}</h3><p>${desc}</p></div></div>`;
              const grid=document.createElement('div');
              grid.className='skills-grid';
              items.forEach(card=>grid.appendChild(card));
              box.appendChild(grid); root.appendChild(box);
            };
            makeBox('Technical Skills','fa-code','Programming, data, BI, machine learning, AI, and development tools.',technical);
            makeBox('Soft Skills','fa-people-group','Professional strengths that support communication, teamwork, and delivery.',soft);

            grids.forEach(g=>g.closest('.skills-subsection')?.remove());
            const tabs=section.querySelector('.tabs'); if(tabs) tabs.remove();
            const oldTitle=section.querySelector('.section-top .title');
            if(oldTitle) oldTitle.innerHTML='MY <span>SKILLS</span>';
            const anchor=section.querySelector('.section-top');
            if(anchor) anchor.insertAdjacentElement('afterend',root); else section.appendChild(root);
            section.dataset.reorganized='true';
          });
          </script>'''

          start=html.find('<style id="skills-category-style">')
          if start!=-1:
              end=html.find('</style>',start)
              html=html[:start]+html[end+8:]
          html=html.replace('</head>',css+'\n</head>',1)

          start=html.find('<script id="skills-category-script">')
          if start!=-1:
              end=html.find('</script>',start)
              html=html[:start]+html[end+9:]
          html=html.replace('</body>',script+'\n</body>',1)

          p.write_text(html,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: simplify skills into technical and soft boxes"
          git push
