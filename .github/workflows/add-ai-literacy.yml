name: Add AI Literacy certificate
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add certificate to portfolio
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "['HP Data Analysis.jpeg','Data Analysis Training','HP · Data Analysis']];"
          new = "['HP Data Analysis.jpeg','Data Analysis Training','HP · Data Analysis'],['AI Literacy.jpeg','AI Literacy','Certificate']];"
          if "['AI Literacy.jpeg','AI Literacy','Certificate']" not in s:
              if old not in s:
                  raise SystemExit('Certificate list anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add AI Literacy certificate"
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/add-ai-literacy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/add-ai-literacy.yml
          git diff --cached --quiet || git commit -m "chore: remove one-time AI Literacy workflow"
          git push
