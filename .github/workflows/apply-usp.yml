name: Apply USP
on:
  push:
    paths:
      - '.github/workflows/apply-usp.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply USP
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='I turn data into clear insights and build practical data and AI solutions using Python, SQL, BI tools, and modern AI technologies.'
          new='I help businesses turn raw data into actionable insights and smarter decisions through Python, SQL, Excel, Power BI, and AI.'
          if old in s:
              s=s.replace(old,new)
          else:
              s=s.replace('I turn data into clear insights and build practical data and AI solutions using Python, SQL, BI tools, and modern AI technologies.','I help businesses turn raw data into actionable insights and smarter decisions through Python, SQL, Excel, Power BI, and AI.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Update CV link text consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('Personal portfolio for **Hassan Ali — Data Analyst | AI & Data Science**.', 'Personal portfolio for **Hassan Ali — Data Analyst | AI & Data Science**.\n\n> I help businesses turn raw data into actionable insights and smarter decisions through Python, SQL, Excel, Power BI, and AI.')
              s=s.replace('Digital Egypt Pioneers Initiative (DEPI) — Data Scientist Track, final score 95%', 'Digital Egypt Pioneers Initiative (DEPI) — Data Scientist Track, In Progress')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md
          git diff --cached --quiet || git commit -m 'feat: apply USP across portfolio'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/apply-usp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary USP workflow'
          git push
