name: Remove DEPI Score
on:
  push:
    paths:
      - '.github/workflows/remove-depi-score.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove DEPI score
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Data Scientist Track · Final Score: 95%'
          new='Data Scientist Track'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: show DEPI as in progress without score'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/remove-depi-score.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/remove-depi-score.yml
          git diff --cached --quiet || git commit -m 'chore: remove temporary workflow'
          git push || true
