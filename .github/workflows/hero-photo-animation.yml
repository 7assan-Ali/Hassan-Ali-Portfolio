name: Animate Hero Profile Photo
on:
  push:
    paths:
      - '.github/workflows/hero-photo-animation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance hero photo animation and move overlay text outside
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
  /* Hero profile photo animation */
  .portrait-shell{animation:heroFloat 5s ease-in-out infinite;}
  .portrait-shell:before{content:"";position:absolute;inset:-12px;border:1px solid #39d0c54d;border-radius:48px;pointer-events:none;animation:heroRing 3.8s ease-in-out infinite;box-shadow:0 0 35px #39d0c526;}
  .portrait-shell:after{content:"";position:absolute;inset:-24px;border:1px dashed #5b8cff55;border-radius:58px;pointer-events:none;animation:heroOrbit 12s linear infinite;}
  .portrait{box-shadow:inset 0 0 45px #39d0c51a;}
  .portrait:before{content:"";position:absolute;width:120px;height:120px;left:-35px;top:8%;border-radius:50%;background:radial-gradient(circle,#39d0c566,transparent 70%);filter:blur(8px);pointer-events:none;z-index:1;animation:heroGlow 4s ease-in-out infinite;}
  .portrait img{animation:heroImage 6s ease-in-out infinite;}
  .portrait-badge,.float-card{position:relative;left:auto;right:auto;top:auto;bottom:auto;}
  .hero-visual .float-card,.hero-visual .portrait-badge{display:none;}
  .hero-visual:before{animation:pulse 3s ease-in-out infinite,heroOrbit 18s linear infinite;}
  .hero-visual:after{animation:spin 22s linear infinite;}
  @keyframes heroFloat{0%,100%{transform:rotate(2deg) translateY(0)}50%{transform:rotate(0deg) translateY(-10px)}}
  @keyframes heroRing{0%,100%{transform:scale(.98);opacity:.35}50%{transform:scale(1.035);opacity:.9}}
  @keyframes heroOrbit{to{transform:rotate(360deg)}}
  @keyframes heroGlow{0%,100%{transform:translate(0,0);opacity:.35}50%{transform:translate(175px,85px);opacity:.8}}
  @keyframes heroImage{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @media(max-width:800px){.portrait-shell:before{inset:-8px}.portrait-shell:after{inset:-15px}}
  @media(prefers-reduced-motion:reduce){.portrait-shell,.portrait-shell:before,.portrait-shell:after,.portrait:before,.portrait img,.hero-visual:before,.hero-visual:after{animation:none!important}}
  '''
          marker='</style>'
          if '/* Hero profile photo animation */' not in s:
              if marker not in s: raise SystemExit('style marker not found')
              s=s.replace(marker,css+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: animate hero profile photo and remove image overlays' || true
          git rm .github/workflows/hero-photo-animation.yml
          git commit -m 'chore: remove temporary hero animation workflow'
          git push
