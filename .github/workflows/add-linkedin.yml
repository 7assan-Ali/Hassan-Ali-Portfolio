name: Add LinkedIn to portfolio

on:
  push:
    paths:
      - '.github/workflows/add-linkedin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add LinkedIn link safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          url = 'https://www.linkedin.com/in/hassan-3li'
          if url not in s:
              link = '<a class="btn ghost" href="' + url + '" target="_blank" rel="noopener noreferrer" aria-label="Open Hassan Ali LinkedIn profile"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>'
              # Prefer the main hero actions so LinkedIn is immediately visible.
              m = re.search(r'(<div[^>]*class=["\'][^"\']*actions[^"\']*["\'][^>]*>)', s, re.I)
              if m:
                  s = s[:m.end()] + '\n' + link + s[m.end():]
              else:
                  # Fallback: place it beside the GitHub contact link.
                  marker = 'https://github.com/7assan-Ali'
                  pos = s.find(marker)
                  if pos != -1:
                      end = s.find('>', pos)
                      s = s[:end+1] + link + s[end+1:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add LinkedIn profile to portfolio'
            git push
          fi
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/add-linkedin.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-time LinkedIn workflow'
            git push
          fi
