name: Portfolio Skills Final Redesign

on: [push]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run redesign script
        run: python scripts/redesign_skills.py
      - name: Commit redesign and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: redesign skills section" || true
          git push
          git rm -f scripts/redesign_skills.py .github/workflows/portfolio-skills-final.yml .github/workflows/skills-layout-global.yml .github/workflows/skills-ui-polish.yml .skills-layout-trigger .skills-layout-trigger-2 .skills-layout-trigger-3 .skills-layout-trigger-4 .skills-layout-trigger-5 .skills-layout-trigger-6 || true
          git commit -m "chore: remove temporary skills workflows" || true
          git push
