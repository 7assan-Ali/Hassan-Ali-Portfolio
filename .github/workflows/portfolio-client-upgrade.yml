name: Portfolio Client Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade portfolio hierarchy
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # 1) Add a focused What I Do section before Skills.
          if 'id="what-i-do"' not in s:
              marker = '<section id="skills">'
              section = '''<section id="what-i-do"><div class="wrap reveal"><div class="kicker">What I Do</div><h2 class="title">How I create <span>value</span></h2><p class="copy">A practical toolkit for turning data into decisions, dashboards, and intelligent solutions.</p><div class="services-grid"><article class="service-card"><div class="service-icon"><i class="fa-solid fa-chart-line"></i></div><h3>Data Analysis</h3><p>Clean, explore, and interpret data to uncover patterns and answer meaningful questions.</p><div class="service-tags"><span>Python</span><span>Pandas</span><span>SQL</span></div></article><article class="service-card"><div class="service-icon"><i class="fa-solid fa-chart-column"></i></div><h3>BI & Dashboards</h3><p>Build clear reporting experiences that make performance and trends easier to understand.</p><div class="service-tags"><span>Power BI</span><span>DAX</span><span>Excel</span></div></article><article class="service-card"><div class="service-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div><h3>Data Science</h3><p>Apply statistical thinking and machine learning fundamentals to practical data problems.</p><div class="service-tags"><span>Statistics</span><span>Machine Learning</span><span>Visualization</span></div></article><article class="service-card"><div class="service-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div><h3>AI & GenAI</h3><p>Explore modern AI workflows, generative AI concepts, prompting, and API-driven solutions.</p><div class="service-tags"><span>Generative AI</span><span>LLMs</span><span>APIs</span></div></article></div></div></section>'''
              if marker not in s:
                  raise SystemExit('Skills marker not found')
              s = s.replace(marker, section + marker, 1)

          # 2) Add What I Do to desktop/mobile navigation if absent.
          if 'href="#what-i-do"' not in s:
              nav_marker = '<a href="#skills">Skills</a>'
              if nav_marker in s:
                  s = s.replace(nav_marker, '<a href="#what-i-do">What I Do</a>' + nav_marker, 1)

          # 3) Strengthen the hero CTA without inventing any new credential.
          if 'Download CV' not in s:
              hero_cv = '<a class="btn ghost" href="cv.html"><i class="fa-solid fa-file-lines"></i> View CV</a>'
              download = '<a class="btn ghost" href="cv.html" download="Hassan-Ali-CV.html"><i class="fa-solid fa-download"></i> Download CV</a>'
              if hero_cv in s:
                  s = s.replace(hero_cv, download, 1)

          # 4) Add a stronger end-of-portfolio CTA inside Contact, once.
          if 'id="final-cta"' not in s:
              contact_marker = '<section id="contact">'
              cta = '''<div class="wrap final-cta reveal" id="final-cta"><div><div class="kicker">Open to opportunities</div><h2>Have data that needs a <span>clear direction?</span></h2><p>Let’s connect and turn the next dataset, dashboard, or AI idea into something useful.</p></div><div class="final-cta-actions"><a class="btn primary" href="mailto:hassanali.elnagy@gmail.com"><i class="fa-solid fa-paper-plane"></i> Start a Conversation</a><a class="btn ghost" href="https://www.linkedin.com/in/hassan-3li" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i> LinkedIn</a></div></div>'''
              if contact_marker not in s:
                  raise SystemExit('Contact marker not found')
              s = s.replace(contact_marker, cta + contact_marker, 1)

          # 5) Premium service/CTA styling, keeping the existing design language.
          css_marker = 'section{padding:125px 0 0}'
          css = '''/* Client-focused portfolio hierarchy */
          .services-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:30px}
          .service-card{min-width:0;padding:23px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,var(--surface2),var(--surface));box-shadow:0 15px 45px #0003;position:relative;overflow:hidden;transition:transform .28s,border-color .28s,box-shadow .28s}
          .service-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#39d0c50d,transparent 58%);pointer-events:none}
          .service-card:hover{transform:translateY(-7px);border-color:#39d0c555;box-shadow:0 24px 60px #0004}
          .service-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--accent);background:#39d0c514;border:1px solid #39d0c52b;font-size:1.05rem;margin-bottom:18px;position:relative}
          .service-card h3{font:700 1.05rem 'Space Grotesk';margin:0 0 8px;position:relative}
          .service-card p{color:var(--muted);font-size:.69rem;line-height:1.65;margin:0;position:relative}
          .service-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:17px;position:relative}
          .service-tags span{padding:5px 8px;border:1px solid #39d0c52b;border-radius:999px;background:#39d0c509;color:#b9ddda;font-size:.58rem;font-weight:800}
          .final-cta{margin-top:90px;padding:30px;border:1px solid #39d0c53d;border-radius:26px;background:linear-gradient(120deg,#0e2335,#0a1625);display:flex;align-items:center;justify-content:space-between;gap:25px;box-shadow:0 20px 65px #0004;position:relative;overflow:hidden}
          .final-cta:before{content:"";position:absolute;width:320px;height:320px;right:-100px;top:-170px;background:radial-gradient(circle,#39d0c51c,transparent 68%);pointer-events:none}
          .final-cta h2{font:700 clamp(1.7rem,3vw,2.6rem)/1.05 'Space Grotesk';letter-spacing:-.05em;margin:8px 0}.final-cta h2 span{color:var(--accent)}.final-cta p{color:var(--muted);margin:8px 0 0;font-size:.78rem}.final-cta-actions{display:flex;gap:9px;flex-wrap:wrap;position:relative}
          '''
          if '/* Client-focused portfolio hierarchy */' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css + css_marker, 1)

          # Responsive rules for the new content.
          responsive_marker = '@media(max-width:1050px){'
          responsive = '@media(max-width:1050px){.services-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.final-cta{align-items:flex-start;flex-direction:column}.final-cta-actions{width:100%}'
          if 'services-grid{grid-template-columns:repeat(2,minmax(0,1fr))}' not in s:
              s = s.replace(responsive_marker, responsive, 1)
          mobile_marker = '@media(max-width:650px){'
          mobile = '@media(max-width:650px){.services-grid{grid-template-columns:1fr}.service-card{padding:20px}.final-cta{padding:23px;margin-top:70px}.final-cta-actions .btn{flex:1}'
          if 'services-grid{grid-template-columns:1fr}' not in s:
              s = s.replace(mobile_marker, mobile, 1)

          path.write_text(s, encoding='utf-8')

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['id="what-i-do"','class="services-grid"','id="final-cta"','Download CV','href="#what-i-do"']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing: '+', '.join(missing))
          if s.count('<html') != 1 or s.count('</html>') != 1:
              raise SystemExit('HTML document boundary check failed')
          print('Portfolio validation passed')
          PY

      - name: Commit upgrade and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: upgrade portfolio client experience" || true
          git rm .github/workflows/portfolio-client-upgrade.yml
          git commit -m "chore: remove one-time portfolio upgrade workflow"
          git push
