name: Style Copy Email Button
on:
  push:
    paths:
      - '.github/workflows/style-copy-email.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Copy Email styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''\n/* Copy Email button */\n#copyEmail{background:linear-gradient(135deg,#39d0c5,#5b8cff);border-color:transparent;color:#041018;box-shadow:0 10px 28px #39d0c526}\n#copyEmail:hover{transform:translateY(-3px);border-color:transparent;box-shadow:0 14px 34px #39d0c54d}\n#copyEmail:active{transform:translateY(-1px)}\n#copyEmail.copied{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}\n'''
          if '#copyEmail{background:' not in s:
              if marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: improve Copy Email button' || true
          git rm .github/workflows/style-copy-email.yml
          git commit -m 'chore: remove temporary styling workflow'
          git push
