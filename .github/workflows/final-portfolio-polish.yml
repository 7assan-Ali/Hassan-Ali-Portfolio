name: Final Portfolio Polish
on:
  push:
    branches: [main]
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final presentation polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Do not claim a direct PDF download when the CV asset is HTML.
          s=s.replace('Download CV</a>', 'View CV</a>', 1)
          s=s.replace('href="cv.html" download="Hassan-Ali-CV.html"', 'href="cv.html"')

          marker='<div class="project-tools">'
          featured='''<div class="featured-work">\n  <div class="featured-head"><div><div class="kicker">Featured Case Studies</div><h3>Start with the work that best represents <span>my toolkit</span></h3></div><p>Three focused projects showing analysis, business intelligence, and practical data-quality work.</p></div>\n  <div class="featured-grid">\n    <article class="featured-card"><div class="featured-number">01</div><div class="featured-icon"><i class="fa-solid fa-cart-shopping"></i></div><div class="featured-type">Data Analysis</div><h4>Olist E-Commerce Data Analysis</h4><p>End-to-end e-commerce analysis covering cleaning, exploratory analysis, customer behavior, sales performance, and dashboard storytelling.</p><div class="featured-tags"><span>Python</span><span>Pandas</span><span>Power BI</span></div></article>\n    <article class="featured-card"><div class="featured-number">02</div><div class="featured-icon"><i class="fa-solid fa-chart-column"></i></div><div class="featured-type">Business Intelligence</div><h4>Power BI Car Sales Dashboard</h4><p>A focused BI project built around sales reporting, visual analysis, and making performance easier to explore.</p><div class="featured-tags"><span>Power BI</span><span>DAX</span><span>Dashboard</span></div><a class="featured-link" href="https://github.com/7assan-Ali/Power-BI" target="_blank" rel="noopener noreferrer">View repository <i class="fa-solid fa-arrow-up-right-from-square"></i></a></article>\n    <article class="featured-card"><div class="featured-number">03</div><div class="featured-icon"><i class="fa-solid fa-filter-circle-dollar"></i></div><div class="featured-type">Data Quality</div><h4>Outlier Detection &amp; Treatment</h4><p>A practical comparison of outlier detection and treatment approaches, including IQR and Z-Score methods.</p><div class="featured-tags"><span>Python</span><span>Statistics</span><span>Data Cleaning</span></div><a class="featured-link" href="https://github.com/7assan-Ali/Outlier-Detection-and-Treatment" target="_blank" rel="noopener noreferrer">View repository <i class="fa-solid fa-arrow-up-right-from-square"></i></a></article>\n  </div>\n</div>\n'''
          if marker in s and 'class="featured-work"' not in s:
              s=s.replace(marker, featured+marker, 1)

          css='''\n/* Final client-facing project presentation */\n.featured-work{margin:30px 0 8px;padding:27px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,var(--surface2),var(--surface));box-shadow:0 20px 60px #0003;position:relative;overflow:hidden}\n.featured-work:before{content:"";position:absolute;width:380px;height:380px;right:-160px;top:-220px;background:radial-gradient(circle,#39d0c51a,transparent 68%);pointer-events:none}\n.featured-head{display:flex;align-items:end;justify-content:space-between;gap:24px;position:relative}\n.featured-head h3{font:700 clamp(1.45rem,3vw,2.15rem)/1.08 'Space Grotesk';letter-spacing:-.045em;margin:7px 0 0}.featured-head h3 span{color:var(--accent)}\n.featured-head p{max-width:420px;color:var(--muted);font-size:.7rem;margin:0}\n.featured-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:21px;position:relative}\n.featured-card{min-width:0;padding:21px;border:1px solid var(--line);border-radius:21px;background:#ffffff04;position:relative;overflow:hidden;transition:.28s}\n.featured-card:hover{transform:translateY(-6px);border-color:#39d0c555;box-shadow:0 20px 45px #0004}\n.featured-number{position:absolute;right:17px;top:14px;font:700 1.6rem 'Space Grotesk';color:#ffffff12}\n.featured-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:#39d0c514;border:1px solid #39d0c52b;margin-bottom:14px}\n.featured-type{text-transform:uppercase;letter-spacing:.13em;font-size:.56rem;font-weight:900;color:var(--accent)}\n.featured-card h4{font:700 1.02rem/1.2 'Space Grotesk';margin:7px 0 8px}.featured-card p{font-size:.67rem;line-height:1.62;color:var(--muted);margin:0}\n.featured-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.featured-tags span{padding:5px 8px;border-radius:999px;border:1px solid #39d0c52b;background:#39d0c509;color:#b9ddda;font-size:.56rem;font-weight:800}\n.featured-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--accent);font-size:.62rem;font-weight:900}.featured-link:hover{text-decoration:underline}\n@media(max-width:900px){.featured-grid{grid-template-columns:1fr 1fr}.featured-head{align-items:start;flex-direction:column}.featured-head p{max-width:620px}}\n@media(max-width:620px){.featured-work{padding:21px}.featured-grid{grid-template-columns:1fr}.featured-card{padding:19px}}\n'''
          if 'Final client-facing project presentation' not in s:
              s=s.replace('</style>',css+'</style>',1)

          # Add a stronger accessible label to the CV icon if it exists.
          s=s.replace('href="cv.html" aria-label="Open CV"','href="cv.html" aria-label="Open Hassan Ali CV"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['featured-work','Olist E-Commerce Data Analysis','Power BI Car Sales Dashboard','Outlier Detection &amp; Treatment','View CV</a>']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'Missing: {missing}')
          print('Final portfolio polish validation: PASS')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "Hassan Ali"
          git config user.email "7sn3li2005@gmail.com"
          git add index.html
          git commit -m "feat: finalize portfolio project presentation" || true
          git push
          rm -f .github/workflows/final-portfolio-polish.yml
          git add .github/workflows/final-portfolio-polish.yml
          git commit -m "chore: remove one-time final polish workflow" || true
          git push
