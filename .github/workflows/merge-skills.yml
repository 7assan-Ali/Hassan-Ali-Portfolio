name: Merge Skills Sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  merge:
    if: ${{ !contains(github.event.head_commit.message, 'merge soft skills into skills section') && !contains(github.event.head_commit.message, 'remove skills merge workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge Soft Skills into Skills section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the standalone Soft Skills navigation item.
          s = re.sub(r'<a href="#soft-skills">Soft Skills</a>', '', s, count=1)

          skills_match = re.search(r'<section id="skills">.*?</section>', s, flags=re.S)
          soft_match = re.search(r'<section id="soft-skills">(.*?)</section>', s, flags=re.S)

          if not skills_match:
              raise SystemExit('Skills section not found')

          if soft_match:
              soft_inner = soft_match.group(1)
              cards_match = re.search(r'<div class="skills-grid"[^>]*>(.*?)</div>', soft_inner, flags=re.S)
              if not cards_match:
                  raise SystemExit('Soft skills cards not found')

              cards = cards_match.group(1).strip()
              soft_block = (
                  '<div class="skills-subsection">'
                  '<div class="skills-subhead">'
                  '<div class="kicker">Professional Strengths</div>'
                  '<h3>Soft <span>Skills</span></h3>'
                  '<p>Professional strengths that support effective collaboration, communication, and data storytelling.</p>'
                  '</div>'
                  '<div class="skills-grid soft-skills-grid">' + cards + '</div>'
                  '</div>'
              )

              skills_section = skills_match.group(0)
              skills_section = skills_section.replace('</div></section>', soft_block + '</div></section>', 1)
              s = s[:skills_match.start()] + skills_section + s[skills_match.end():]
              s = s[:soft_match.start()] + s[soft_match.end():]

          # Styling for the two-part Skills section.
          css = '''
          .skills-subsection{margin-top:62px;padding-top:42px;border-top:1px solid var(--line)}
          .skills-subhead{margin-bottom:2px}
          .skills-subhead h3{font:700 clamp(1.55rem,3vw,2.25rem)/1 'Space Grotesk';letter-spacing:-.05em;margin:8px 0 7px}
          .skills-subhead h3 span{color:var(--accent)}
          .skills-subhead p{max-width:680px;color:var(--muted);margin:0}
          .soft-skills-grid{margin-top:23px}
          @media(max-width:650px){.skills-subsection{margin-top:48px;padding-top:32px}}
          '''
          if '.skills-subsection{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit merged layout and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: merge soft skills into skills section" || exit 0
          git push
          git rm .github/workflows/merge-skills.yml
          git commit -m "chore: remove skills merge workflow"
          git push