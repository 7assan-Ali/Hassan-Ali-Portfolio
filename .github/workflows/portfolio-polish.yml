name: Portfolio polish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portfolio-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch portfolio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # LinkedIn: add a clear profile link to the contact area if it is not already present.
          if 'linkedin.com/in/hassan-3li' not in s:
              marker = '<a href="https://github.com/7assan-Ali"'
              if marker in s:
                  linkedin = '<a href="https://www.linkedin.com/in/hassan-3li" target="_blank" rel="noopener" class="contact-link"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>'
                  s = s.replace(marker, linkedin + marker, 1)

          loader_css = r'''
          /* Premium opening loader */
          #ha-loader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#050b14;opacity:1;visibility:visible;transition:opacity .65s ease,visibility .65s ease;overflow:hidden}
          #ha-loader::before{content:"";position:absolute;width:55vmin;height:55vmin;border-radius:50%;background:radial-gradient(circle,rgba(57,208,197,.13),transparent 68%);filter:blur(8px);animation:haPulse 1.8s ease-in-out infinite}
          #ha-loader.ha-loader-hide{opacity:0;visibility:hidden;pointer-events:none}
          .ha-loader-inner{position:relative;width:min(82vw,360px);text-align:center}
          .ha-loader-logo{width:min(72vw,270px);height:auto;display:block;margin:0 auto 28px;animation:haFloat 1.8s ease-in-out infinite}
          .ha-loader-line{height:4px;width:100%;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;box-shadow:0 0 22px rgba(57,208,197,.12)}
          .ha-loader-progress{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#39d0c5,#5b8cff);box-shadow:0 0 18px rgba(57,208,197,.45);transition:width .15s ease}
          .ha-loader-label{margin-top:12px;font:700 11px/1.4 Arial,sans-serif;letter-spacing:2.5px;color:#91a2b7;text-transform:uppercase}
          .ha-loader-percent{margin-top:7px;font:800 13px/1 Arial,sans-serif;color:#f6f9fc}
          @keyframes haFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.015)}}
          @keyframes haPulse{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.08);opacity:1}}
          @media(max-width:600px){.ha-loader-inner{width:78vw}.ha-loader-logo{margin-bottom:24px}.ha-loader-line{height:3px}}
          @media(prefers-reduced-motion:reduce){#ha-loader::before,.ha-loader-logo{animation:none!important}#ha-loader{transition:none}}
          '''

          loader_html = r'''
          <div id="ha-loader" role="status" aria-label="Loading Hassan Ali portfolio">
            <div class="ha-loader-inner">
              <img class="ha-loader-logo" src="assets/hassan-ali-loader.svg" alt="Hassan Ali">
              <div class="ha-loader-line"><div class="ha-loader-progress" id="ha-loader-progress"></div></div>
              <div class="ha-loader-label">Data • AI • Insights</div>
              <div class="ha-loader-percent" id="ha-loader-percent">0%</div>
            </div>
          </div>
          '''

          loader_js = r'''
          <script>
          (()=>{
            const loader=document.getElementById('ha-loader');
            const bar=document.getElementById('ha-loader-progress');
            const pct=document.getElementById('ha-loader-percent');
            if(!loader||!bar||!pct)return;
            document.documentElement.style.overflow='hidden';
            const start=performance.now();
            let value=0;
            const tick=()=>{
              const elapsed=performance.now()-start;
              const target=Math.min(92,Math.round((elapsed/950)*92));
              if(target>value){value=target;bar.style.width=value+'%';pct.textContent=value+'%';}
              if(value<92)requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            const finish=()=>{
              const wait=Math.max(0,900-(performance.now()-start));
              setTimeout(()=>{
                value=100;bar.style.width='100%';pct.textContent='100%';
                setTimeout(()=>{
                  loader.classList.add('ha-loader-hide');
                  document.documentElement.style.overflow='';
                  setTimeout(()=>loader.remove(),700);
                },180);
              },wait);
            };
            if(document.readyState==='complete') finish(); else window.addEventListener('load',finish,{once:true});
            setTimeout(finish,2800);
          })();
          </script>
          '''

          if 'id="ha-loader"' not in s:
              s = re.sub(r'(<body[^>]*>)', r'\1' + loader_html, s, count=1, flags=re.I)
              pos=s.lower().rfind('</style>')
              if pos!=-1:
                  s=s[:pos]+loader_css+'\n'+s[pos:]
              pos=s.lower().rfind('</body>')
              if pos!=-1:
                  s=s[:pos]+loader_js+'\n'+s[pos:]

          # Mobile safety improvements without changing the existing design.
          mobile_css = r'''
          @media(max-width:768px){html{overflow-x:hidden}body{overflow-x:hidden}.container{width:min(100% - 28px,1180px)}.hero{padding-top:30px}.hero-grid{grid-template-columns:1fr!important;gap:30px!important}.hero-copy{order:1}.hero-visual{order:2;max-width:420px;margin-inline:auto}.projects-grid,.skills-grid,.soft-skills-grid{grid-template-columns:1fr!important}.nav-links{gap:10px;flex-wrap:wrap}.nav-links a{font-size:12px}.section{padding-block:64px}.contact-form{width:100%}img{max-width:100%;height:auto}}
          @media(max-width:480px){.container{width:min(100% - 20px,1180px)}.hero h1{font-size:clamp(42px,13vw,64px)}.hero p{font-size:15px}.btn,.contact-link{width:100%;justify-content:center}.hero-actions{display:grid;grid-template-columns:1fr;gap:10px}.nav{padding-inline:10px}.nav-links{display:none}}
          '''
          if 'Mobile safety improvements' not in s:
              pos=s.lower().rfind('</style>')
              if pos!=-1:s=s[:pos]+mobile_css+'\n'+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add LinkedIn, mobile polish, and opening loader"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/portfolio-polish.yml
          git commit -m "chore: remove one-time portfolio polish workflow"
          git push
