name: Fix loading logo and LinkedIn

on:
  push:
    paths:
      - '.github/workflows/fix-loader-linkedin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Show the premium HA logo itself in the loading screen.
          s = s.replace('assets/hassan-ali-loader.svg', 'assets/hassan-ali-logo.svg')

          # Make the loading logo larger and cinematic without depending on a new asset.
          if '#ha-loader img' not in s:
              s = s.replace('</style>', '#ha-loader img{width:min(230px,58vw);height:auto;display:block;filter:drop-shadow(0 0 35px #39d0c566);animation:haLogoFloat 2.8s ease-in-out infinite}\n@keyframes haLogoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.025)}}\n@media(max-width:480px){#ha-loader img{width:min(190px,62vw)}}\n</style>', 1)

          # Put LinkedIn in the main navigation so it is always visible on desktop.
          if 'href="https://www.linkedin.com/in/hassan-3li"' not in s:
              nav_link = '<a href="https://www.linkedin.com/in/hassan-3li" target="_blank" rel="noopener noreferrer" aria-label="Open Hassan Ali LinkedIn profile"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>'
              s = s.replace('<div class="navlinks">', '<div class="navlinks">' + nav_link, 1)

          # If LinkedIn already exists only as a button, add a clear labeled nav link too.
          else:
              nav_open = s.find('<div class="navlinks">')
              nav_close = s.find('</div>', nav_open + 1) if nav_open >= 0 else -1
              nav_chunk = s[nav_open:nav_close] if nav_open >= 0 and nav_close >= 0 else ''
              if 'linkedin.com/in/hassan-3li' not in nav_chunk:
                  nav_link = '<a href="https://www.linkedin.com/in/hassan-3li" target="_blank" rel="noopener noreferrer" aria-label="Open Hassan Ali LinkedIn profile"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>'
                  s = s[:nav_open] + s[nav_open:].replace('<div class="navlinks">', '<div class="navlinks">' + nav_link, 1)

          # Add a visible LinkedIn button beside the contact actions if the contact area has actions.
          if 'linkedin-contact-link' not in s:
              contact_link = '<a id="linkedin-contact-link" class="btn ghost" href="https://www.linkedin.com/in/hassan-3li" target="_blank" rel="noopener noreferrer" aria-label="Open Hassan Ali LinkedIn profile"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>'
              marker = '<div class="contact-actions">'
              if marker in s:
                  s = s.replace(marker, marker + contact_link, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show HA logo in loader and LinkedIn clearly'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-loader-linkedin.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || (git commit -m 'chore: remove one-time loader workflow' && git push)
