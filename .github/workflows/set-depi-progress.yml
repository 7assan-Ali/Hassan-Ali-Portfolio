name: Set DEPI Progress
on:
  push:
    paths:
      - '.github/workflows/set-depi-progress.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set DEPI to In Progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(
              r'(<h3>DEPI Data Scientist Training</h3>\s*<div class="org">)[^<]*(</div>)',
              r'\1In Progress\2',
              s,
              count=1
          )
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'content: set DEPI status to In Progress'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/set-depi-progress.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary workflow' || true
          git push || true
