name: Merge Skills Sections

on:
  push:
    branches: [main]

jobs:
  merge-skills:
    if: ${{ !contains(github.event.head_commit.message, 'feat: merge technical and soft skills') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge skills into one section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the standalone Soft Skills section, but preserve its cards.
          soft_match = re.search(r'<section id="soft-skills">.*?</section>', s, re.S)
          if not soft_match:
              raise SystemExit('Standalone Soft Skills section was not found; refusing to modify index.html')

          soft_section = soft_match.group(0)
          grid_match = re.search(r'<div class="skills-grid" style="margin-top:23px">(.*?)</div></div></section>', soft_section, re.S)
          if not grid_match:
              raise SystemExit('Soft Skills cards were not found; refusing to modify index.html')

          soft_cards = grid_match.group(1).strip()
          s = s[:soft_match.start()] + s[soft_match.end():]

          # Keep one Skills section and divide it visually into Technical Skills and Soft Skills.
          s = s.replace(
              '<h2 class="title">Technical <span>Skills</span></h2>',
              '<h2 class="title">Technical & <span>Professional Skills</span></h2>',
              1
          )

          s = s.replace(
              '<p class="copy">A practical toolkit across data analysis, BI, programming, databases, and AI.</p><div class="tabs" id="skillTabs">',
              '<p class="copy">A practical toolkit across data analysis, BI, programming, databases, AI, and professional strengths.</p><div class="skill-part"><div class="skill-part-head"><span class="skill-part-kicker">01 · Technical</span><h3>Technical Skills</h3><p>Core technologies and tools I use for data, analytics, BI, programming, and AI.</p></div><div class="tabs" id="skillTabs">',
              1
          )

          s = s.replace(
              '<div class="skills-grid" id="skillsGrid"></div></div></section>',
              '<div class="skills-grid" id="skillsGrid"></div></div><div class="skill-part skill-part-soft"><div class="skill-part-head"><span class="skill-part-kicker">02 · Professional</span><h3>Soft Skills</h3><p>Professional strengths that support collaboration, communication, problem solving, and data storytelling.</p></div><div class="skills-grid soft-skills-grid">' + soft_cards + '</div></div></div></section>',
              1
          )

          if 'id="soft-skills"' in s:
              raise SystemExit('Soft Skills section still exists after merge')

          # Remove the old standalone Soft Skills navigation item if present.
          s = s.replace('<a href="#soft-skills">Soft Skills</a>', '', 1)

          css = r'''
          /* Unified Skills section */
          #skills .copy{max-width:760px}
          .skill-part{margin-top:34px;padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#0e1d30aa,#09132188);box-shadow:0 16px 55px #0002}
          .skill-part + .skill-part{margin-top:18px}
          .skill-part-head{margin-bottom:20px}
          .skill-part-kicker{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
          .skill-part-head h3{font:700 clamp(1.25rem,2vw,1.65rem)/1.1 'Space Grotesk';margin:0}
          .skill-part-head p{color:var(--muted);font-size:.74rem;margin:7px 0 0;max-width:650px}
          .skill-part .tabs{margin:0 0 16px}
          .skill-part .skills-grid{margin-top:0}
          .soft-skills-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
          @media(max-width:1050px){.soft-skills-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:650px){.skill-part{padding:20px;border-radius:21px}.soft-skills-grid{grid-template-columns:1fr}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/skills-ui-polish.yml
          git commit -m "feat: merge technical and soft skills"
          git push
          git rm .github/workflows/skills-ui-polish.yml
          git commit -m "chore: remove one-time skills workflow"
          git push
