<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Hassan Ali — Data Analyst | AI & Data Science portfolio.">
<title>Hassan Ali | Data Analyst · AI & Data Science</title>
<link rel="icon" type="image/svg+xml" href="assets/hassan-ali-logo.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12}
#portfolio-frame{display:block;width:100%;height:100%;border:0;background:#050a12}
</style>
</head>
<body>
<iframe id="portfolio-frame" src="portfolio-original.html" title="Hassan Ali Portfolio"></iframe>
<script>
(function(){
  const frame=document.getElementById('portfolio-frame');
  function polish(){
    const doc=frame.contentDocument;
    if(!doc||!doc.head)return;
    if(doc.getElementById('nav-premium-fix'))return;
    const style=doc.createElement('style');
    style.id='nav-premium-fix';
    style.textContent=`
      .nav{height:82px;background:rgba(5,10,18,.86);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(135%);}
      .navin{gap:14px;}
      .nav .wrap{width:min(1320px,calc(100% - 32px));}
      .brand{gap:11px;font-size:1.18rem;flex:0 0 auto;}
      .brand-logo{width:43px;height:43px;border-radius:12px;box-shadow:0 0 34px var(--glow),0 0 0 1px rgba(255,255,255,.08);}
      .navlinks{flex:1;justify-content:center;gap:clamp(.62rem,1vw,.95rem);min-width:0;}
      .navlinks a{font-size:.64rem;letter-spacing:.075em;white-space:nowrap;padding:8px 0;}
      .navlinks a.active:after{bottom:-14px;height:3px;}
      .nav-actions{gap:6px;flex:0 0 auto;}
      .nav-actions .btn.ghost{width:39px;height:39px;min-height:39px;padding:0;border-radius:11px;font-size:0;justify-content:center;background:rgba(255,255,255,.045);border-color:var(--line);}
      .nav-actions .btn.ghost i{font-size:.92rem;color:#4fd8d0;}
      .nav-actions .btn.ghost:hover{background:rgba(57,208,197,.1);border-color:#39d0c566;box-shadow:0 10px 28px #39d0c526;}
      .nav-actions .icon{width:39px;height:39px;border-radius:11px;}
      @media(max-width:1180px){.navlinks{gap:.62rem}.navlinks a{font-size:.59rem;letter-spacing:.055em}.brand{font-size:1.08rem}.brand-logo{width:40px;height:40px}.nav .wrap{width:calc(100% - 24px)}}
      @media(max-width:1050px){.nav{height:74px}.nav .wrap{width:calc(100% - 24px)}.navlinks{top:74px}.navlinks a{font-size:.72rem;letter-spacing:.08em}.nav-actions .btn.ghost{width:40px;height:40px;min-height:40px}.brand-logo{width:40px;height:40px}}
      @media(max-width:650px){.nav{height:70px}.nav .wrap{width:calc(100% - 20px)}.brand{gap:8px;font-size:1rem}.brand-logo{width:37px;height:37px;border-radius:10px}.nav-actions .btn.ghost{display:none}.nav-actions .icon{width:37px;height:37px;border-radius:10px}.navlinks{top:70px}}
    `;
    doc.head.appendChild(style);
  }
  frame.addEventListener('load',polish);
})();
</script>
</body>
</html>
